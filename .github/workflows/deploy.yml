name: Deploy

# Mỗi lần push lên main: test → build Docker image → đẩy lên GHCR → (tùy chọn) deploy.
# Bật kênh deploy bằng cách thêm secret tương ứng trong Settings → Secrets and variables → Actions:
#   - Render:  RENDER_DEPLOY_HOOK_URL
#   - VPS:     VPS_HOST, VPS_USER, VPS_SSH_KEY (tùy chọn VPS_PORT, APP_PORT)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Kiểm thử tích hợp
        run: npm run test:integration

  docker:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Deploy lên Render
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "$RENDER_HOOK"

      - name: Deploy lên VPS qua SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APP_SERVERS: ${{ secrets.APP_SERVERS }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_PASSWORD,APP_SERVERS,TRUST_PROXY,DATABASE_URL
          script: |
            set -e
            IMAGE=${{ needs.docker.outputs.image }}:latest
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f game-lobby 2>/dev/null || true
            docker run -d --name game-lobby --restart unless-stopped --read-only --cap-drop ALL --security-opt no-new-privileges -p ${{ secrets.APP_PORT || 80 }}:3001 -e APP_PASSWORD="$APP_PASSWORD" -e APP_SERVERS="$APP_SERVERS" -e TRUST_PROXY="$TRUST_PROXY" -e DATABASE_URL="$DATABASE_URL" "$IMAGE"
            docker image prune -f

      - name: Tóm tắt
        run: |
          echo "### Image: \`${{ needs.docker.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$RENDER_HOOK" ] && [ -z "$VPS_HOST" ]; then
            echo "Chưa cấu hình kênh deploy (RENDER_DEPLOY_HOOK_URL hoặc VPS_HOST). Image đã sẵn sàng trên GHCR." >> "$GITHUB_STEP_SUMMARY"
          fi
