name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm tra lỗ hổng thư viện (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit test (luật chơi)
        run: npm test
      - name: Build client
        run: npm run build
      - name: Kiểm thử tích hợp (server + socket)
        run: |
          PORT=3001 TRUST_PROXY=1 VOICE_SERVERS='Bên A' APP_SERVERS='{"Bên A":"ci-secret","Bên B":"ci-secret-b"}' node server/src/index.js &
          npx --yes wait-on -t 20000 http://localhost:3001/health
          TRUST_PROXY=1 APP_PASSWORD=ci-secret OTHER_PASSWORD=ci-secret-b npm run test:e2e -- http://localhost:3001
