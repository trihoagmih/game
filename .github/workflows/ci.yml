name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm tra lỗ hổng thư viện (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit test (luật chơi)
        run: npm test
      - name: Build client
        run: npm run build
      - name: Kiểm thử tích hợp (server + socket)
        run: |
          PORT=3001 TRUST_PROXY=1 VOICE_SERVERS='Bên A' APP_SERVERS='{"Bên A":"ci-secret","Bên B":"ci-secret-b"}' node server/src/index.js &
          npx --yes wait-on -t 20000 http://localhost:3001/health
          TRUST_PROXY=1 APP_PASSWORD=ci-secret OTHER_PASSWORD=ci-secret-b npm run test:e2e -- http://localhost:3001

  # Build thử Docker image (giống image chạy trên Render) và chạy nó: bắt lỗi do đổi phiên bản Node / thư viện native (Alpine)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: game-lobby:ci
          cache-from: type=gha
      - name: Chạy image và kiểm tra /health
        run: |
          docker run -d --name app -p 3001:3001 -e APP_PASSWORD=ci-secret game-lobby:ci
          npx --yes wait-on -t 30000 http://localhost:3001/health
          curl -fsS http://localhost:3001/health
          curl -fsS -o /dev/null http://localhost:3001/room/abc
          docker logs app
