name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript-only source and type-debt policy
        env:
          SOURCE_POLICY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:source
      - name: ESLint (syntax, correctness and React Hooks)
        run: npm run lint
      - name: Strict source, config, script and test typecheck
        run: npm run typecheck
  compose:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the complete cluster through Nginx
        env:
          APP_PASSWORD: compose-ci-password
          REDIS_PASSWORD: compose-ci-redis
          POSTGRES_PASSWORD: compose-ci-postgres
          SNAPSHOT_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:3001/ready
          npx tsx server/test/compose-smoke.ts http://127.0.0.1:3001
      - name: Container logs
        if: failure()
        env:
          APP_PASSWORD: compose-ci-password
          REDIS_PASSWORD: compose-ci-redis
          POSTGRES_PASSWORD: compose-ci-postgres
          SNAPSHOT_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose logs --tail=100
  test:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: game
          POSTGRES_USER: game
          POSTGRES_PASSWORD: ci-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U game -d game"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgresql://game:ci-postgres@127.0.0.1:5432/game
      DATABASE_URL: postgresql://game:ci-postgres@127.0.0.1:5432/game
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm tra lỗ hổng thư viện (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit test (luật chơi)
        run: npm test
      - name: Build shared, server và client
        run: npm run build
      - name: Kiểm thử tích hợp (server + socket)
        run: npm run test:integration
      - name: Build Docker runtime
        run: docker build --tag game-lobby:ci .
