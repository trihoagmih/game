events { worker_connections 4096; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Only trust the Docker bridge/host-side reverse proxy, never arbitrary clients.
  set_real_ip_from 172.30.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_x_forwarded_proto $upstream_proto { default $scheme; https https; }
  server {
    listen 80;
    location ~ ^/nodes/(a|b)/(socket.io/.*)$ {
      set $backend "node-$1:3001";
      rewrite ^/nodes/(a|b)/(.*)$ /$2 break;
      proxy_pass http://$backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $upstream_proto;
      proxy_read_timeout 75s;
      proxy_buffering off;
    }
    location / {
      set $backend "node-a:3001";
      proxy_pass http://$backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $upstream_proto;
      proxy_read_timeout 75s;
    }
  }
}
