# Render Blueprint: https://render.com/docs/blueprint-spec
# Vào Render → New → Blueprint → chọn repo này là xong (hỗ trợ WebSocket).
services:
  - type: web
    name: game-lobby
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: false   # deploy do GitHub Actions kích hoạt qua deploy hook
    envVars:
      - key: PORT
        value: 3001
      - key: TRUST_PROXY
        value: "1"
      - key: APP_PASSWORD   # mật khẩu vào app — nhập trên dashboard Render
        sync: false
      - key: APP_SERVERS    # nhiều server, vd {"Bên A":"mk-A","Bên B":"mk-B"} — thay cho APP_PASSWORD
        sync: false
      - key: DATABASE_URL   # URL PostgreSQL riêng (Supabase/Neon/Render), nhập trong dashboard
        sync: false
