name: game-lobby
x-game: &game
  # Mặc định build tại chỗ. Máy yếu: đặt GAME_IMAGE=ghcr.io/<owner>/<repo>:latest trong .env
  # rồi `docker compose pull && docker compose up -d --no-build` để dùng image CI đã build.
  image: ${GAME_IMAGE:-game-lobby:local}
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 25s
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  environment: &environment
    PORT: 3001
    TRUST_PROXY: 1
    # Origin khác được phép kết nối (vd client trên GitHub Pages). Trống = chỉ cùng domain.
    CORS_ORIGIN: ${CORS_ORIGIN:-}
    APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
    # Nhiều workspace, mỗi workspace một mật khẩu (JSON). Có giá trị thì APP_PASSWORD bị bỏ qua.
    APP_SERVERS: ${APP_SERVERS:-}
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set a URL-safe REDIS_PASSWORD in .env}@redis:6379
    REDIS_NAMESPACE: game:v1
    WORKSPACE_RECORDS_NAMESPACE: ${WORKSPACE_RECORDS_NAMESPACE:-game:v1}
    DATABASE_URL: postgresql://game:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}@postgres:5432/game
    CLUSTER_NODES: a,b
    MAX_SPECTATORS_PER_ROOM: ${MAX_SPECTATORS_PER_ROOM:-30}
    SNAPSHOT_KEY: ${SNAPSHOT_KEY:?Set a 64-character hex SNAPSHOT_KEY in .env}
    VOICE_ENABLED: ${VOICE_ENABLED:-1}
    # Chuỗi rỗng sẽ tắt voice ở mọi workspace, nên luôn giữ giá trị mặc định của app.
    VOICE_SERVERS: ${VOICE_SERVERS:-B4}
    VOICE_MAX_PER_ROOM: ${VOICE_MAX_PER_ROOM:-6}
    VOICE_TURN_ENABLED: ${VOICE_TURN_ENABLED:-1}
    CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
    CF_TURN_KEY_API_TOKEN: ${CF_TURN_KEY_API_TOKEN:-}
    CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
    CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
    VOICE_TURN_QUOTA_GB: ${VOICE_TURN_QUOTA_GB:-900}
    VOICE_QUOTA_ACTION: ${VOICE_QUOTA_ACTION:-disable}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U game -d game']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port: Redis is reachable only on the Compose network.

  node-a:
    <<: *game
    environment:
      <<: *environment
      NODE_ID: a
  node-b:
    <<: *game
    environment:
      <<: *environment
      NODE_ID: b
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${APP_PORT:-3001}:80']
    volumes: ['./deploy/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [node-a, node-b]

volumes:
  redis-data:
  postgres-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
