name: game-lobby
x-game: &game
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 25s
  depends_on:
    redis:
      condition: service_healthy
  environment: &environment
    PORT: 3001
    TRUST_PROXY: 1
    APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set a URL-safe REDIS_PASSWORD in .env}@redis:6379
    REDIS_NAMESPACE: game:v1
    CLUSTER_NODES: a,b
    MAX_SPECTATORS_PER_ROOM: ${MAX_SPECTATORS_PER_ROOM:-30}
    SNAPSHOT_KEY: ${SNAPSHOT_KEY:?Set a 64-character hex SNAPSHOT_KEY in .env}

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port: Redis is reachable only on the Compose network.

  node-a:
    <<: *game
    environment:
      <<: *environment
      NODE_ID: a
  node-b:
    <<: *game
    environment:
      <<: *environment
      NODE_ID: b
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${APP_PORT:-3001}:80']
    volumes: ['./deploy/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [node-a, node-b]

volumes:
  redis-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
